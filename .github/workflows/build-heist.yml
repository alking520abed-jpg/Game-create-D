name: Build Heist APK

on:
  push:
    paths:
      - "heist/**"
      - ".github/workflows/build-heist.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.5.1"
    defaults:
      run:
        working-directory: heist
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot and export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-android-v1

      - name: Download Godot and Android templates
        run: |
          if [ ! -x "$HOME/godot/godot" ]; then
            base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
            mkdir -p "$HOME/godot" && cd "$HOME/godot"
            curl -fsSL -o g.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -q g.zip && mv Godot_v*_linux.x86_64 godot && rm g.zip
            curl -fsSL -o t.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            T="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
            mkdir -p "$T"
            unzip -q -j t.tpz templates/android_debug.apk templates/android_release.apk templates/android_source.zip templates/version.txt -d "$T"
            rm t.tpz
          fi

      - name: Configure Godot for Android export
        run: |
          mkdir -p "$HOME/.config/godot"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo ''
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$ANDROID_HOME\""
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            echo "export/android/debug_keystore = \"$GITHUB_WORKSPACE/heist/tools/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
          } > "$HOME/.config/godot/editor_settings-4.5.tres"

      - name: Import project
        run: $HOME/godot/godot --headless --import

      - name: Export APK
        run: |
          mkdir -p build
          $HOME/godot/godot --headless --export-debug "Android" build/alkhazna.apk
          test -s build/alkhazna.apk

      - uses: actions/upload-artifact@v4
        with:
          name: alkhazna-apk
          path: heist/build/alkhazna.apk
